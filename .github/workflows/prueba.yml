name: prueba

on: 
  schedule:
    # Se ejecuta a las 12:19 UTC (6:19 AM hora local Costa Rica UTC-6)
    - cron: '19 12 * * *'
  # Permite ejecutar el flujo manualmente desde la pestaña Actions de GitHub para pruebas
  workflow_dispatch:

jobs: 
  build:
    runs-on: ubuntu-latest

    permissions:
      # Da permiso al GITHUB_TOKEN para hacer commit y push al repositorio.
      contents: write

    steps: 
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Obtener y guardar tipo de cambio
        env:
          EXCHANGE_RATE_API_URL: ${{ secrets.EXCHANGE_RATE_API_URL }}
        run: python fetch_exchange_rate.py 

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_user_name: 'Victor desde GIT ACTIONS'
          commit_user_email: 'salgadovictor91@gmail.com'
          commit_message: 'Actualizar historial de tipo de cambio USD-CRC'
          commit_author: 'victor2691 <salgadovictor91@gmail.com>'
